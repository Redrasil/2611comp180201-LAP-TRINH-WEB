<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Hồ cá tương tác - bài tập Thiết kế Web">
    <title>Hồ cá | Bài tập Thiết kế Web</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="topbar">
        <a class="back-link" href="../profile.html">← CV cá nhân</a>
        <div class="title"><span class="bubble"></span><span>BLUE</span> LAGOON</div>
        <button class="sound-toggle" type="button" aria-pressed="false">Âm thanh: tắt</button>
    </header>
    <main>
        <section class="aquarium" aria-label="Hồ cá tương tác">
            <div class="water-surface"></div>
            <div class="light-ray ray-one"></div><div class="light-ray ray-two"></div>
            <div class="bubbles" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
            <img class="fish school-fish" src="assets/goldFishSchool.png" alt="Đàn cá vàng">
            <img class="fish faint-fish" src="assets/faintSchool.png" alt="Đàn cá xanh">
            <img class="animal turtle" src="assets/turtle.png" alt="Rùa biển">
            <img class="animal shark" src="assets/shark.png" alt="Cá mập">
            <img class="diver diver-one" src="assets/diver1.png" alt="Thợ lặn màu xanh">
            <img class="diver diver-two" src="assets/diver2.png" alt="Thợ lặn màu hồng">
            <img class="diver diver-three" src="assets/diver3.png" alt="Thợ lặn màu xanh lá">
            <div class="sand"></div><div class="seaweed seaweed-left"></div><div class="seaweed seaweed-right"></div>
            <div class="sign">WELCOME<br><small>to my aquarium</small></div>
        </section>
        <section class="info">
            <p class="eyebrow">A LITTLE OCEAN</p>
            <h1>Chạm vào đại dương<br><em>và khám phá.</em></h1>
            <p class="description">Một góc hồ cá nhỏ được xây dựng bằng HTML5, CSS3 và JavaScript. Hãy bật chuyển động để xem những sinh vật dưới nước bơi lội.</p>
            <button class="motion-button" type="button" aria-pressed="true">Tạm dừng chuyển động <span>Ⅱ</span></button>
        </section>
    </main>
    <footer><span>THIẾT KẾ WEB · 2026</span><span>SCROLL TO EXPLORE ↓</span></footer>
    <script src="script.js"></script>
</body>
</html>
